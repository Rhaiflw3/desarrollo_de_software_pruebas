<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura de una pagina HTML</title>
    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: white;
            text-align: center;
        }

        h3 {
            color: orange;
            text-align: center;
        }

        p {
            font-family: verdana;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>H1 primera pagina con CSS</h1>

    <p>este es un parrafo.</p>

    <h2>¿Qué puedes hacer con JavaScript?</h2>

    <p id="demo">con JavaScript puedes cambiar el contenido HTML</p>

    <button type="button" onclick="document.getElementById('demo').innerHTML = 'Hola Curso Desarrollo de software I!'">
        Hacer Click!
    </button>
    
    <h3>segunto parrafo con HTML</h3>
</body>
</html>
